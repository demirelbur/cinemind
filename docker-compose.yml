services:
  db:
    image: postgres:17-alpine
    container_name: cinemind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinemind_db
      POSTGRES_USER: cinemind_user
      POSTGRES_PASSWORD: cinemind_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemind_user -d cinemind_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: cinemind-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cinemind_user:cinemind_pass@db:5432/cinemind_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg://cinemind_user:cinemind_pass@db:5432/cinemind_db
      LLM_PROVIDER: openrouter
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai/gpt-4o}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
    expose:
      - "8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "cinemind.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      dockerfile: Dockerfile.frontend
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
    container_name: cinemind-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: cinemind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
